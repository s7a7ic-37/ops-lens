name: Data and browser checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test web/helpers.test.mjs
      - name: Check published report accounting
        run: |
          python - <<'PY'
          import json
          r = json.load(open('web/report.json'))
          q = r['quality']
          assert sum(q['row_types'].values()) == q['scoped_rows']
          assert q['input_rows'] == q['outside_country'] + q['final_date_rows'] + q['scoped_rows']
          assert len(r['products']) == r['summary']['forecast_products']
          assert all(len(p['forecast']) == 7 and len(p['evaluation']) == 28 for p in r['products'])
          assert r['source']['license'] == 'CC BY 4.0'
          PY
      - name: Scan published files for credentials
        run: >-
          docker run --rm --network none --read-only
          -v "$PWD/web:/scan:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /scan --redact=100 --no-banner
